name: Release Artifacts

on:
  release:
    types: [published]
  workflow_call:
    inputs:
      tag:
        description: "Release tag to build and upload artifacts for (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-and-upload:
    name: Build & Upload (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            target: linux-amd64
          - goos: darwin
            goarch: arm64
            target: darwin-arm64
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}

      - name: Read Go version from .tool-versions
        id: tools
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Ensure zstd is installed
        run: |
          if ! command -v zstd >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y zstd
          fi

      - name: Cross-compile and package Stravin binaries
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_TAG}" ]; then
            echo "RELEASE_TAG is empty" >&2
            exit 1
          fi

          stage_dir="dist/stravin-core-${RELEASE_TAG}-${{ matrix.target }}"
          archive="stravin-core-${RELEASE_TAG}-${{ matrix.target }}.tar.zst"
          checksum="${archive}.sha256"
          mkdir -p "${stage_dir}"

          binaries=(
            stravin-edge
            stravin-node
            stravin-pack
            stravin-ctrl
            stravin-relay
            stravin-admin
            stravin-loadgen
            stravin-chaos
          )

          for bin in "${binaries[@]}"; do
            echo "Building ${bin} (${{ matrix.goos }}/${{ matrix.goarch }}) at ${RELEASE_TAG}..."
            CGO_ENABLED=0 GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}" \
              go build -trimpath \
              -ldflags="-s -w -X stravin.dev/core/internal/version.Version=${RELEASE_TAG}" \
              -o "${stage_dir}/${bin}" "./cmd/${bin}"
          done

          tar -cf - -C dist "stravin-core-${RELEASE_TAG}-${{ matrix.target }}" | zstd -T0 -19 --long=27 -o "dist/${archive}"
          (
            cd dist
            sha256sum "${archive}" > "${checksum}"
          )

      - name: Upload release artifacts
        run: |
          set -euo pipefail
          archive="dist/stravin-core-${RELEASE_TAG}-${{ matrix.target }}.tar.zst"
          checksum="${archive}.sha256"
          gh release upload "${RELEASE_TAG}" "${archive}" "${checksum}" --clobber
