name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  pre-commit:
    name: Pre-commit & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read tool versions from .tool-versions
        id: tools
        run: |
          echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "golangci_lint=$(awk '$1 == "golangci-lint" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"
          echo "pre_commit=$(awk '$1 == "pre-commit" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Cache golangci-lint binary and cache
        id: golangci-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/bin/golangci-lint
            ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ steps.tools.outputs.golangci_lint }}-${{ hashFiles('.golangci.yml', 'go.sum') }}
          restore-keys: |
            golangci-lint-${{ runner.os }}-${{ steps.tools.outputs.golangci_lint }}-

      - name: Install golangci-lint
        run: |
          mkdir -p "$HOME/bin"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          if [ ! -x "$HOME/bin/golangci-lint" ]; then
            curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
              | sh -s -- -b "$HOME/bin" "v${{ steps.tools.outputs.golangci_lint }}"
          fi
          "$HOME/bin/golangci-lint" --version

      - name: Cache pre-commit environments
        uses: actions/cache@v6
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ runner.os }}-${{ steps.tools.outputs.pre_commit }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Install pre-commit
        run: |
          python -m pip install --disable-pip-version-check "pre-commit==${{ steps.tools.outputs.pre_commit }}"
          pre-commit --version

      - name: Run pre-commit on all files
        run: pre-commit run --all-files --show-diff-on-failure

  unit-tests:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Go version from .tool-versions
        id: tools
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector and coverage
        run: go test -race -cover ./...

      - name: Build all daemons and admin CLI
        run: |
          mkdir -p bin
          for d in edge node pack ctrl relay admin; do
            CGO_ENABLED=0 go build -o "bin/stravin-$d" "./cmd/stravin-$d"
          done

  integration-tests:
    name: Integration Tests (Docker Compose + Floci)
    runs-on: ubuntu-latest
    env:
      AWS_ENDPOINT_URL: http://localhost:4566
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_REGION: us-east-1
      AWS_DEFAULT_REGION: us-east-1
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Go version from .tool-versions
        id: tools
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Start Floci and run bootstrap
        run: |
          docker compose up -d floci floci-init
          init_id="$(docker compose ps -a -q floci-init)"
          if [ -z "${init_id}" ]; then
            echo "floci-init container not found" >&2
            exit 1
          fi
          exit_code="$(timeout 120 docker wait "${init_id}")"
          if [ "${exit_code}" != "0" ]; then
            echo "floci-init failed with exit code ${exit_code}" >&2
            docker compose logs floci-init
            exit 1
          fi

      - name: Run Floci wire parity smoke test
        run: ./scripts/floci-parity-test.sh

      - name: Run Go integration tests
        run: go test -race -v -tags=integration ./...

      - name: Dump Floci logs on failure
        if: failure()
        run: docker compose logs floci floci-init

      - name: Tear down Docker Compose stack
        if: always()
        run: docker compose down -v --remove-orphans

  e2e-tests:
    name: E2E Suite (6/6 Docker Compose + Floci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Go version from .tool-versions
        id: tools
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Run 6/6 E2E suite against Docker Compose + Floci
        run: make e2e

  multi-region-e2e:
    name: Multi-Region E2E (Dual Floci + Sync)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Read Go version from .tool-versions
        id: tools
        run: echo "go=$(awk '$1 == "golang" { print $2 }' .tool-versions)" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ steps.tools.outputs.go }}
          cache: true

      - name: Build Floci test sync images
        run: make build-floci-test-tools

      - name: Run multi-region sync E2E suite
        run: make multi-region-e2e

  semver-dry-run:
    name: Semantic Release Dry Run
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    outputs:
      has_release: ${{ steps.dry_run.outputs.has_release }}
      next_version: ${{ steps.dry_run.outputs.next_version }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Run semantic-release dry run
        id: dry_run
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          output="$(npx --yes \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/exec \
            -p @semantic-release/git \
            semantic-release --dry-run 2>&1 | tee /dev/stderr)"
          next_version="$(printf '%s\n' "${output}" \
            | sed -E 's/\x1B\[[0-9;]*[A-Za-z]//g' \
            | sed -nE 's/.*The next release version is ([0-9]+\.[0-9]+\.[0-9]+[^[:space:]]*).*/\1/p' \
            | tail -n 1)"
          if [ -n "${next_version}" ]; then
            echo "has_release=true" >> "$GITHUB_OUTPUT"
            echo "next_version=v${next_version}" >> "$GITHUB_OUTPUT"
          else
            echo "has_release=false" >> "$GITHUB_OUTPUT"
            echo "next_version=" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    needs: [semver-dry-run, pre-commit, unit-tests, integration-tests, e2e-tests, multi-region-e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.semver-dry-run.outputs.has_release == 'true'
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
      tag: ${{ steps.publish.outputs.tag }}
    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Run semantic-release
        id: publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          rm -f .semantic-release-tag
          npx --yes \
            -p semantic-release \
            -p @semantic-release/changelog \
            -p @semantic-release/exec \
            -p @semantic-release/git \
            semantic-release
          if [ -s .semantic-release-tag ]; then
            tag="$(tr -d '[:space:]' < .semantic-release-tag)"
            rm -f .semantic-release-tag
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "tag=" >> "$GITHUB_OUTPUT"
          fi

  release-artifacts:
    name: Release Artifacts
    needs: [release]
    if: needs.release.outputs.published == 'true'
    permissions:
      contents: write
    uses: ./.github/workflows/release-artifacts.yml
    with:
      tag: ${{ needs.release.outputs.tag }}
